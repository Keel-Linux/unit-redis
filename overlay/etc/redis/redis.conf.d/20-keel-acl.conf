# Keel: who may do what on this server, before any secret exists.
#
# Redis has no database account. Its secret is either "requirepass", which
# is one password for the built in "default" user, or an ACL user with a
# password of its own. This component uses an ACL user, and the two lines
# below are the state the layer is published in: an administrative account
# that authenticates nothing, and a default account that can ask the server
# what it is and touch no data.
#
# Why an ACL user and not requirepass, which is what the upstream appliance
# set:
#
#   1. requirepass is the default user's password, so setting it locks the
#      whole server behind one secret, including "INFO". That is the one
#      thing `keel inspect` reads to report database.server.role, it never
#      reads a secret to get past a refusal, and a Redis it cannot ask is
#      reported as a role it could not infer. The role is also the seam the
#      replication modes of decision 0013 are built on, so a standalone
#      appliance that cannot say it is standalone breaks the next step.
#   2. requirepass lives in /etc/redis/redis.conf, which the package ships
#      as root:root 0644. The upstream appliance therefore wrote the Redis
#      password into a world readable file, and shipped turnkey-redis-pw to
#      print it back out. An ACL password can be stored as its SHA-256,
#      which is what firstboot.d/35redispass writes, into a file this
#      component installs as root:redis 0640.
#
# What "default" may do is one command, INFO, and no key and no channel: the
# three questions `keel inspect` asks (INFO replication, INFO cluster, INFO
# server) are answered without a secret, and GET on any key is refused with
# NOPERM. Measured, and asserted by the conf script of this component on the
# build and by firstboot.d/35redispass on the machine.
user default on nopass +info

# The administrative account, created unusable. "off" means it cannot
# authenticate at all, whatever is sent, which is this component's version
# of the invalid password hash keel-mariadb publishes its admin account
# with: a layer is published once and reused by every appliance built on it,
# so a password chosen at build time would be the same password everywhere,
# and a random one would make the layer irreproducible (brief section 5.4).
#
# firstboot.d/35redispass replaces this line from the instance description,
# in 50-keel-secret.conf, which the include of redis.conf reads after this
# file. If the description renames the account through app.options.db_user,
# the line below stays as it is, and an account that is off is an account
# nobody can use.
user admin off

# Keel: Redis listens on both loopback families, and both are literal
# addresses.
#
# Debian's redis.conf ships "bind 127.0.0.1 -::1". The dash is Redis's mark
# for an optional address: if ::1 cannot be bound the server starts anyway
# and says nothing, which is a server that answers one family and looks
# right. Both are named here without it, so a machine that cannot bind ::1
# fails at the first line instead of at the first client.
#
# IPv6 comes first because that is the default this project builds for
# (brief section 10), and a name is never used. Debian's /etc/hosts maps ::1
# to ip6-localhost and ip6-loopback and never to localhost, so "bind
# localhost" resolves to 127.0.0.1 alone: that is how the PostgreSQL
# appliance shipped listening on IPv4 only (docs/traps.md, "On Debian,
# localhost is not an IPv6 name"). Two literal addresses cannot resolve into
# something else.
#
# The port is not opened to the network. This component is what an appliance
# that needs Redis is built on, and those talk to it from the same machine.
# Opening it, saying who may reach it and terminating TLS is a decision the
# appliance makes, and the console modes of decision 0013 are where it will
# be made.
#
# protected-mode is left exactly as Debian sets it. With a bind list it
# changes nothing, and restating a setting that does nothing here would only
# make the next reader wonder what it is for.
bind ::1 127.0.0.1
